
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Check-In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div>
                <p class="date" id="today"></p>
                <h1>Digital <span>Check-In</span></h1>
                <p class="subtitle">Pick up where you left and end it!</p>
            </div>

            <div class="progress">
                <span id="progressValue">0%</span>
                <small>done today</small>
            </div>
        </header>

        <section class="add-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What needs to get done?"
            >

            <select id="priority">
                <option value="normal">Normal</option>
                <option value="high">High priority</option>
                <option value="low">Low priority</option>
            </select>

            <button id="addTaskButton">+ Add task</button>
        </section>

        <div class="toolbar">
            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">To do</button>
                <button class="filter" data-filter="completed">Done</button>
            </div>

            <button id="clearCompleted" class="clear-button">
                Clear completed
            </button>
        </div>

        <section class="task-area">
            <ul id="taskList"></ul>

            <div id="emptyState" class="empty-state">
                <div class="empty-line"></div>
                <h2>A little space to begin.</h2>
                <p>Add a task and take it from there.</p>
            </div>
        </section>

        <footer>
            <span id="taskCount">0 tasks</span>
            <span>One thing at a time.</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
