<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Check-In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <main class="todo-app">

        <!-- Header -->

        <header class="app-header">

            <div class="heading">

                <p class="date" id="today"></p>

                <h1 class="main-title">
    <span>Digital</span> <span>Check-In</span>
</h1>

                <p class="subtitle">
                    Pick up where you left and end it!
                </p>

            </div>


            <div class="progress-box">

                <div class="progress-ring">
                    <span id="progressValue">0%</span>
                </div>

                <p>completed</p>

            </div>

        </header>


        <!-- Add task -->

        <section class="add-task-box">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to get done?"
                autocomplete="off"
            >

            <select id="priority">

                <option value="normal">
                    Normal
                </option>

                <option value="high">
                    High Priority
                </option>

                <option value="low">
                    Low Priority
                </option>

            </select>

            <button id="addTaskButton">
                <span>+</span>
                Add Task
            </button>

        </section>


        <p class="tip">
            Press <strong>Enter</strong> to quickly add a task
        </p>


        <!-- Toolbar -->

        <div class="task-toolbar">

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter"
                    data-filter="completed">
                    Completed
                </button>

            </div>


            <button id="clearCompleted">
                Clear completed
            </button>

        </div>


        <!-- Tasks -->

        <section class="tasks-section">

            <ul id="taskList"></ul>


            <div class="empty-state" id="emptyState">

                <div class="empty-icon">
                    ✦
                </div>

                <h2>Nothing here yet</h2>

                <p>
                    Add something small. Get something big done.
                </p>

            </div>

        </section>


        <!-- Footer -->

        <footer class="app-footer">

            <span id="taskCount">
                0 tasks
            </span>

            <span class="footer-message">
                One task at a time ✨
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
